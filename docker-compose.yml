services:
  convex:
    image: ghcr.io/convex/convex-backend:latest
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      DO_NOT_REQUIRE_SSL: ${DO_NOT_REQUIRE_SSL}
      CONVEX_URL: ${CONVEX_URL}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL}
    ports:
      - "${CONVEX_PORT}:3210"
      - "${CONVEX_SITE_PORT}:3211"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
        - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "${APP_PORT}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
      - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL}
      - CONVEX_SELF_HOSTED_URL=http://convex:3210
    depends_on:
      - convex
