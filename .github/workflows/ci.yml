name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_CONVEX_URL: http://localhost:3210
  NEXT_PUBLIC_CONVEX_SITE_URL: http://localhost:3211

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (Next.js + Convex functions)
        run: bun run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js app
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  convex-validate:
    name: convex-validate
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start ephemeral Convex backend (sqlite, no Postgres)
        run: |
          docker run -d --name convex-ci \
            -p 3210:3210 -p 3211:3211 \
            ghcr.io/convex/convex-backend:latest

      - name: Wait for Convex backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3210/version > /dev/null; then
              echo "Convex backend is up"
              exit 0
            fi
            echo "Waiting for Convex backend... ($i)"
            sleep 2
          done
          echo "Convex backend never became healthy"
          docker logs convex-ci
          exit 1

      - name: Generate admin key and deploy functions
        run: |
          ADMIN_KEY=$(docker exec convex-ci ./generate_admin_key.sh | tail -n 1)
          echo "::add-mask::$ADMIN_KEY"
          CONVEX_SELF_HOSTED_URL=http://localhost:3210 \
          CONVEX_SELF_HOSTED_ADMIN_KEY="$ADMIN_KEY" \
          npx convex dev --once

      - name: Tear down Convex backend
        if: always()
        run: docker rm -f convex-ci

  health-check:
    name: health-check
    runs-on: ubuntu-latest
    needs: [build, convex-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Write ephemeral .env for docker compose
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=
          CONVEX_PORT=3210
          CONVEX_SITE_PORT=3211
          APP_PORT=3001
          POSTGRES_URL=
          DO_NOT_REQUIRE_SSL=1
          CONVEX_URL=http://localhost:3210
          CONVEX_SITE_URL=http://localhost:3211
          CONVEX_SELF_HOSTED_URL=http://localhost:3210
          NEXT_PUBLIC_CONVEX_URL=http://localhost:3210
          NEXT_PUBLIC_CONVEX_SITE_URL=http://localhost:3211
          GROQ_API=
          EOF
          cat > .env.local <<EOF
          NEXT_PUBLIC_CONVEX_URL=http://localhost:3210
          NEXT_PUBLIC_CONVEX_SITE_URL=http://localhost:3211
          EOF

      - name: Build and start full stack
        run: docker compose up -d --build

      - name: Wait for Convex backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3210/version > /dev/null; then
              echo "Convex backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Convex backend health check failed"
          docker compose logs convex
          exit 1

      - name: Wait for Next.js app health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "App healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App health check failed"
          docker compose logs app
          exit 1

      - name: Verify app health response
        run: |
          RESPONSE=$(curl -sf http://localhost:3001/api/health)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'

      - name: Tear down stack
        if: always()
        run: docker compose down -v
